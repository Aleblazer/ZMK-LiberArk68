---
include:
  - board: xiao_ble//zmk
    shield: liberark68_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_left
  - board: xiao_ble//zmk
    shield: liberark68_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_right
  # Dongle: third Xiao + Prospector adapter with the 2.79" NV3007 panel,
  # Operator layout on a 428x142 canvas (prospector-zmk-module
  # feat/nv3007-wide-port).
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y
    artifact-name: liberark68_nv3007_dongle
  # The other layouts on the NV3007. The dongle .conf selects Operator; each
  # cmake arg overrides that choice.
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
    artifact-name: liberark68_nv3007_dongle_field
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
    artifact-name: liberark68_nv3007_dongle_classic
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
    artifact-name: liberark68_nv3007_dongle_radii
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_GOSSIP=y
    artifact-name: liberark68_nv3007_dongle_gossip
  # Settings wipe image — all three boards are Xiao nRF52840 again.
  # Flash, wait ~5s, then re-flash normal firmware.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
