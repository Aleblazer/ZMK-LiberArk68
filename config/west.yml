manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: halfdane
      url-base: https://github.com/halfdane
    - name: aleblazer
      url-base: https://github.com/Aleblazer
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: prospector-zmk-module
      remote: aleblazer
      # Diagnostic ILI9341 build with display inversion enabled.
      revision: 6837847bbeeca7548b193e2efdfa6ca0796138a7
    # Converts the FT6336's absolute touch coordinates into the relative
    # X/Y events expected by ZMK's HID mouse path. Pinned for reproducibility.
    - name: zmk-input-processors
      remote: halfdane
      revision: 7d18ba7af91e485bbd9febda150505fb38ce6d8a
    # Fork adds per-channel report-threshold (deadband) so the slide-pot input
    # goes quiet at rest and the wireless halves can deep-sleep, plus what the
    # I2C-ADC fader board needs: the channel's devicetree gain is used for the
    # mV conversion (the old code hardcoded the nRF SAADC's), a power-gpios FET
    # gate powers the pot only while sampling, and idle-sampling-hz slows the
    # poll once the fader is quiet. Pinned to the commit so the module cache
    # can't serve the un-patched upstream.
    - name: zmk-analog-input-driver
      remote: aleblazer
      revision: 3c83111
    # Fork with absolute-axis support in the joystick forwarder (for the
    # slide faders); upstream only forwards relative movement. Faders are
    # emitted entirely under a vendor page (0xFF00) -- axes and buttons included,
    # not just the top-level collection -- so neither Windows nor Steam Input/SDL
    # treat the device as a game controller, plus an optional USB heartbeat to
    # re-send the latched axes at rest. Pinned to the commit to bypass the module
    # cache (bump the SHA whenever the fork changes).
    - name: zmk-hid-io
      remote: aleblazer
      revision: 94d7ddc
  self:
    path: config
