manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: aleblazer
      url-base: https://github.com/Aleblazer
    - name: aym1607
      url-base: https://github.com/AYM1607
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-driver-azoteq-iqs5xx
      remote: aym1607
      revision: main
    - name: zmk-oled-adapter
      remote: mctechnology17
      revision: main
    # Volumetric SH1107 display module (ten stacked OLEDs on two SPI buses)
    # for the voxel dongle build. Tracks main.
    - name: zmk-voxel-display
      remote: aleblazer
      revision: main
  self:
    path: config
