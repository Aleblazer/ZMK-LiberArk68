# LiberArk68 - LEFT half (peripheral)
# Studio is hosted on the dongle; do not enable here.
CONFIG_ZMK_SLEEP=y

# 10k slide fader on P0.04 (AIN2) via the analog-input driver
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_ANALOG_INPUT=y

# Bring-up logging: watch raw + reported fader values over a USB serial
# console. Remove once both faders are confirmed reading a clean 0..100.
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y
CONFIG_ZMK_USB_LOGGING=y
