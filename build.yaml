---
include:
  - board: xiao_ble//zmk
    shield: liberark68_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_left
  - board: xiao_ble//zmk
    shield: liberark68_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_right
  # Dongle: third Xiao + Prospector adapter with the 2.79" NV3007 panel
  # (428x142 Operator layout from prospector-zmk-module feat/nv3007-wide-port).
  # Bring-up images: the driver paints RGB bars + white border for 8 s at
  # boot. Three variants to compare on the panel; restore a single target with
  # the studio-rpc-usb-uart snippet and no NV3007_* args once it is proven.
  #  - vendor init, SPI mode 0, plus USB serial logging (no Studio)
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y -DCONFIG_NV3007_INIT_TEST_PATTERN_HOLD_MS=8000
    artifact-name: liberark68_nv3007_dongle_log
  #  - LVGL / Arduino_GFX init variant (programs F9)
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y -DCONFIG_NV3007_INIT_TEST_PATTERN_HOLD_MS=8000 -DCONFIG_NV3007_INIT_F9=y
    artifact-name: liberark68_nv3007_dongle_f9
  #  - SPI mode 3 (clock idles high), vendor init
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y -DCONFIG_NV3007_INIT_TEST_PATTERN_HOLD_MS=8000 -DCONFIG_NV3007_SPI_MODE3=y
    artifact-name: liberark68_nv3007_dongle_mode3
  # Settings wipe image — all three boards are Xiao nRF52840 again.
  # Flash, wait ~5s, then re-flash normal firmware.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
