# LiberArk68 - DONGLE (central + ZMK Studio host) on Xiao nRF52840 + Prospector

# Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# USB HID output (so the dongle is the device that talks to your computer)
CONFIG_ZMK_USB=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Peripheral battery levels for the status display
CONFIG_ZMK_BATTERY_REPORTING=y

# Prospector status screen (feat/new-status-screens) — pick exactly one:
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Optional Prospector tuning
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
