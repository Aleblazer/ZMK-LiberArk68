# LiberArk68 - DONGLE (central + ZMK Studio host) on Xiao nRF52840 + Prospector

# Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# USB HID output (so the dongle is the device that talks to your computer)
CONFIG_ZMK_USB=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Peripheral battery levels for the status display
CONFIG_ZMK_BATTERY_REPORTING=y

# The central must run the input subsystem to process input split events
# received from the peripherals and dispatch them to the input-listeners
# below (the trackpad variant's dongle had this and the relay worked).
# Without it the input-split receivers + listeners are inert, so fader
# events never reach hid-io.
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# HID-IO: expose the two faders to the PC as a 2-axis joystick.
# This is a SECOND USB HID interface, so the HID device count is 2
# (keyboard + hid-io). NOTE: ZMK Studio uses USB-CDC, not HID, so it does
# NOT count here — 2 is correct, not 3.
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_JOYSTICK=y
# Faders report only on change (so the halves can sleep), which leaves the
# device silent at rest. Re-send the latched axes over USB every second so the
# PC app shows the current position right after it opens, instead of 0 until you
# move a fader. USB-only, so the halves' battery is unaffected.
CONFIG_ZMK_HID_IO_JOYSTICK_HEARTBEAT_MS=1000

# Prospector status screen (ILI9341 port) — pick exactly one:
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Optional Prospector tuning
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# Diagnostic: keep the backlight continuously on to eliminate PWM ripple.
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=100

# Keep the partial LVGL render buffer practical for the larger 320x240 panel,
# especially alongside Studio and the second HID interface on the dongle.
CONFIG_LV_Z_VDB_SIZE=25
