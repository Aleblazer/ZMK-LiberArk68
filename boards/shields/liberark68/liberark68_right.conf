# LiberArk68 - RIGHT half (peripheral)
CONFIG_ZMK_SLEEP=y

# 10k slide fader read by an ADS1115 on the VIK add-on board (i2c1, 0x48),
# with the pot's excitation FET-gated on P1.12. See liberark68_fader.dtsi.
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_ANALOG_INPUT=y
CONFIG_ADC_ADS1X1X=y

# Pass the devicetree channel config (gain, reference, data rate) through to
# adc_channel_setup instead of the driver's nRF-shaped defaults. Required here:
# the default is ADC_GAIN_1_6, which the ADS1115 rejects outright.
CONFIG_ANALOG_INPUT_USE_DTS_ADC_CH_CFG=y

# The ADS1115 is 16-bit, but a single-ended reading gives up the sign bit and
# the driver checks the sequence resolution exactly, so this must be 15.
CONFIG_ANALOG_INPUT_ADC_RES=15

# No CONFIG_PM_DEVICE_RUNTIME needed for the I2C block: xiao_ble declares i2c1
# as "nordic,nrf-twi", and that driver already calls nrfx_twi_enable/disable
# around each transfer, so the peripheral is off between fader samples. (The
# TWIM driver is the one that stays enabled without runtime PM - if i2c1 is
# ever switched to "nordic,nrf-twim", revisit this.)

# Enables ZMK's split-input plumbing so the fader's input-split endpoint is
# registered for BLE forwarding to the dongle (same requirement the trackpad
# had). Without it, the peripheral split service fails to compile.
CONFIG_ZMK_POINTING=y
