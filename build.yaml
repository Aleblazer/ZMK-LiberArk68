---
include:
  - board: xiao_ble//zmk
    shield: liberark68_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_left
  - board: xiao_ble//zmk
    shield: liberark68_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_right
  # Dongle: third Xiao + Prospector adapter with the 2.79" NV3007 panel
  # (428x142 Operator layout from prospector-zmk-module feat/nv3007-wide-port).
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    # Bring-up aid: the driver paints RGB bars + white border for 3 s at boot.
    # Drop NV3007_INIT_TEST_PATTERN once the panel is proven.
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y
    artifact-name: liberark68_nv3007_dongle
  # Settings wipe image — all three boards are Xiao nRF52840 again.
  # Flash, wait ~5s, then re-flash normal firmware.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
