manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: aleblazer
      url-base: https://github.com/Aleblazer
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: prospector-zmk-module
      remote: carrefinho
      revision: feat/new-status-screens
    # Fork adds per-channel report-threshold (deadband) so the noisy slide-pot
    # input goes quiet at rest and the wireless halves can deep-sleep. Pinned to
    # the commit so the module cache can't serve the un-patched upstream.
    - name: zmk-analog-input-driver
      remote: aleblazer
      revision: 0cac587
    # Fork with absolute-axis support in the joystick forwarder (for the
    # slide faders); upstream only forwards relative movement. Faders are
    # emitted under a vendor page (0xFF00) so Windows doesn't treat the device
    # as a game controller, plus an optional USB heartbeat to re-send the
    # latched axes at rest. Pinned to the commit to bypass the module cache.
    - name: zmk-hid-io
      remote: aleblazer
      revision: 66c9f73
  self:
    path: config
