# LiberArk68 - RIGHT half (peripheral)
CONFIG_ZMK_SLEEP=y

# 10k slide fader on P0.04 (AIN2) via the analog-input driver
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_ANALOG_INPUT=y

# Enables ZMK's split-input plumbing so the fader's input-split endpoint is
# registered for BLE forwarding to the dongle (same requirement the trackpad
# had). Without it, the peripheral split service fails to compile.
CONFIG_ZMK_POINTING=y

# Bring-up logging: watch the reported 0..254 fader value over a USB serial
# console. Raw ADC logging is off so the report line stays readable — flip
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y back on to see the underlying counts.
# Remove this whole block once both faders are confirmed.
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y
CONFIG_ZMK_USB_LOGGING=y
