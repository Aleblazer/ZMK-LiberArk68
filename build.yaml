---
include:
  - board: xiao_ble//zmk
    shield: liberark68_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_left
  - board: xiao_ble//zmk
    shield: liberark68_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_right
  # Dongle: third Xiao + Prospector adapter with the 2.79" NV3007 panel
  # (428x142 Operator layout from prospector-zmk-module feat/nv3007-wide-port).
  # Pixel format probe: fills the screen solid three times (red 16 bit, red
  # 18 bit, blue 18 bit), 4 s each. Whichever red looks solid is the format
  # the panel honours. Diagnostic only.
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y -DCONFIG_NV3007_INIT_TEST_PATTERN_HOLD_MS=4000
    artifact-name: liberark68_nv3007_probe
  # Candidate fix: keep the panel in its native 18 bit mode and expand
  # RGB565 to RGB666 in the driver. Flash this if the 18 bit red is solid.
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_PIXEL_FORMAT_18BIT=y
    artifact-name: liberark68_nv3007_18bit
  # Settings wipe image — all three boards are Xiao nRF52840 again.
  # Flash, wait ~5s, then re-flash normal firmware.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
