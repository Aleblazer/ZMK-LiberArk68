# LiberArk68 - LEFT half (peripheral)
# Studio is hosted on the dongle; do not enable here.
CONFIG_ZMK_SLEEP=y

# Rotary encoders (EC11) on the VIK pins
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bottom encoder uses P0.09/P0.10 — the nRF52840 NFC pins. Free them for GPIO.
CONFIG_NFCT_PINS_AS_GPIOS=y
