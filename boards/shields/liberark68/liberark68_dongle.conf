# LiberArk68 - DONGLE (central + ZMK Studio host) on nice!nano + OLED adapter

# Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# USB HID output (so the dongle is the device that talks to your computer)
CONFIG_ZMK_USB=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Peripheral battery levels for the status display
CONFIG_ZMK_BATTERY_REPORTING=y

# Pointing/mouse HID — relays the right half's trackpad to the host
CONFIG_ZMK_POINTING=y

# 128x64 OLED status screen (oled_adapter_pro_micro_128x64 shield)
CONFIG_ZMK_DISPLAY=y
