# LiberArk68 - LEFT half (peripheral)
# Studio is hosted on the dongle; do not enable here.
CONFIG_ZMK_SLEEP=y

# Rotary encoders (EC11) on the VIK pins
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bottom encoder uses P0.09/P0.10 — the nRF52840 NFC pins. Free them for GPIO.
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- PHASE 0: fader bring-up (10k pot on P0.04 / AIN2) ---
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_ANALOG_INPUT=y
# Print raw ADC values so we can confirm the fader moves before wiring up
# the split/HID/PC pipeline. Watch over a USB serial console.
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
CONFIG_ZMK_USB_LOGGING=y
