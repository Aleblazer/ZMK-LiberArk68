manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: aleblazer
      url-base: https://github.com/Aleblazer
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: prospector-zmk-module
      remote: carrefinho
      revision: feat/new-status-screens
    - name: zmk-analog-input-driver
      remote: badjeff
      revision: main
    # Fork with absolute-axis support in the joystick forwarder (for the
    # slide faders); upstream only forwards relative movement.
    - name: zmk-hid-io
      remote: aleblazer
      revision: absolute-faders
  self:
    path: config
