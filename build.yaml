---
include:
  - board: xiao_ble//zmk
    shield: liberark68_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_left
  - board: xiao_ble//zmk
    shield: liberark68_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: liberark68_right
  # Dongle: third Xiao + Prospector adapter with the 2.79" NV3007 panel
  # (428x142 Operator layout from prospector-zmk-module feat/nv3007-wide-port).
  # Coverage probe: fills the screen white at two bytes per pixel, then at
  # three, 5 s each. How much of the glass turns white says which byte ratio
  # the panel is using. USB serial logging instead of Studio, so the driver
  # also reports geometry, MADCTL and byte counts. Diagnostic only.
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_INIT_TEST_PATTERN=y -DCONFIG_NV3007_INIT_TEST_PATTERN_HOLD_MS=5000
    artifact-name: liberark68_nv3007_probe
  # Candidate: keep the panel in its native 18 bit mode and expand RGB565 to
  # RGB666 in the driver.
  - board: xiao_ble//zmk
    shield: liberark68_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_NV3007_PIXEL_FORMAT_18BIT=y
    artifact-name: liberark68_nv3007_18bit
  # Settings wipe image — all three boards are Xiao nRF52840 again.
  # Flash, wait ~5s, then re-flash normal firmware.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
